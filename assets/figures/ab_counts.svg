-anchor="start" font-weight="500">파랑: 일반 관찰   노랑: 재검토   빨강: 점검 요청</text><text x="100" y="800" font-size="40" fill="#163247" text-anchor="start" font-weight="500">활동지의 가상 점수 12개입니다. 실제 고장 정답이 아닙니다.</text></g></svg>