<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="신호가 끊겼을 때 멈추는 방향으로"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="70" y="95" font-size="58" fill="#163247" text-anchor="start" font-weight="700">신호가 끊겼을 때 멈추는 방향으로</text><rect x="80" y="210" width="650" height="400" rx="20" fill="#edf6f7" stroke="#b9d3df" stroke-width="3"/><rect x="870" y="210" width="650" height="400" rx="20" fill="#fff0f0" stroke="#b9d3df" stroke-width="3"/><text x="405" y="305" font-size="46" fill="#163247" text-anchor="middle" font-weight="700">평상시 닫힌 접점</text><text x="405" y="395" font-size="48" fill="#007f86" text-anchor="middle" font-weight="500">신호 연결</text><text x="405" y="505" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">다른 안전조건도 함께 확인</text><text x="1195" y="305" font-size="46" fill="#163247" text-anchor="middle" font-weight="700">버튼 누름 또는 단선</text><text x="1195" y="395" font-size="48" fill="#cc424b" text-anchor="middle" font-weight="500">신호 끊김</text><text x="1195" y="505" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">안전하지 않은 쪽으로 판단</text><text x="90" y="735" font-size="42" fill="#163247" text-anchor="start" font-weight="500">b접점의 목적을 이해하는 개념도입니다.</text><text x="90" y="805" font-size="40" fill="#163247" text-anchor="start" font-weight="500">실제 장비의 안전회로 설계와 현장 절차는 별도로 확인합니다.</text></g></svg>