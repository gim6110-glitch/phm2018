<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="반도체 공정에서 식각의 위치"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="70" y="95" font-size="58" fill="#163247" text-anchor="start" font-weight="700">반도체 공정에서 식각의 위치</text><rect x="70" y="260" width="330" height="260" rx="20" fill="#eaf3f8" stroke="#b9d3df" stroke-width="3"/><text x="235" y="345" font-size="43" fill="#163247" text-anchor="middle" font-weight="700">회로 모양 준비</text><text x="235" y="425" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">설계와 마스크</text><path d="M410 390 L450 390" fill="none" stroke="#007f86" stroke-width="7" marker-end="url(#arrow)"/><rect x="460" y="260" width="330" height="260" rx="20" fill="#eaf3f8" stroke="#b9d3df" stroke-width="3"/><text x="625" y="345" font-size="43" fill="#163247" text-anchor="middle" font-weight="700">포토</text><text x="625" y="425" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">모양을 옮김</text><path d="M800 390 L840 390" fill="none" stroke="#007f86" stroke-width="7" marker-end="url(#arrow)"/><rect x="850" y="260" width="330" height="260" rx="20" fill="#e1f4f1" stroke="#b9d3df" stroke-width="3"/><text x="1015" y="345" font-size="43" fill="#163247" text-anchor="middle" font-weight="700">식각</text><text x="1015" y="425" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">필요한 부분 제거</text><path d="M1190 390 L1230 390" fill="none" stroke="#007f86" stroke-width="7" marker-end="url(#arrow)"/><rect x="1240" y="260" width="330" height="260" rx="20" fill="#eaf3f8" stroke="#b9d3df" stroke-width="3"/><text x="1405" y="345" font-size="43" fill="#163247" text-anchor="middle" font-weight="700">검사와 다음 공정</text><text x="1405" y="425" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">결과를 확인</text><text x="80" y="650" font-size="40" fill="#163247" text-anchor="start" font-weight="500">여러 공정이 반복됩니다. 이 수업은 식각 장비의 냉각 문제를 살펴봅니다.</text><text x="80" y="730" font-size="40" fill="#163247" text-anchor="start" font-weight="500">공정의 위치를 이해하기 위한 단순화된 그림입니다.</text></g></svg>