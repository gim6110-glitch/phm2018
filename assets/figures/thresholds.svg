<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="두 기준선으로 세 구간 나누기"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="70" y="95" font-size="58" fill="#163247" text-anchor="start" font-weight="700">두 기준선으로 세 구간 나누기</text><rect x="120" y="290" width="450" height="210" rx="20" fill="#e8f3f9" stroke="#b9d3df" stroke-width="3"/><rect x="570" y="290" width="450" height="210" rx="20" fill="#fff4d7" stroke="#b9d3df" stroke-width="3"/><rect x="1020" y="290" width="450" height="210" rx="20" fill="#ffe9eb" stroke="#b9d3df" stroke-width="3"/><text x="345" y="380" font-size="48" fill="#163247" text-anchor="middle" font-weight="500">일반 관찰</text><text x="795" y="380" font-size="48" fill="#163247" text-anchor="middle" font-weight="500">재검토</text><text x="1245" y="380" font-size="48" fill="#163247" text-anchor="middle" font-weight="500">점검 요청</text><text x="345" y="445" font-size="42" fill="#163247" text-anchor="middle" font-weight="500">점수 &lt; T1</text><text x="795" y="445" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">T1 ≤ 점수 &lt; T2</text><text x="1245" y="445" font-size="42" fill="#163247" text-anchor="middle" font-weight="500">T2 ≤ 점수</text><path d="M120 560 L1470 560" fill="none" stroke="#007f86" stroke-width="7"/><path d="M570 260 L570 600" fill="none" stroke="#d49c18" stroke-width="7"/><path d="M1020 260 L1020 600" fill="none" stroke="#cc424b" stroke-width="7"/><text x="570" y="680" font-size="48" fill="#d49c18" text-anchor="middle" font-weight="700">T1</text><text x="1020" y="680" font-size="48" fill="#cc424b" text-anchor="middle" font-weight="700">T2</text><text x="120" y="785" font-size="40" fill="#163247" text-anchor="start" font-weight="500">기준선과 같은 값은 높은 단계에 넣습니다. 점수는 고장 확률