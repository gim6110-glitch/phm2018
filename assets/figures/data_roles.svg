<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="자료마다 맡은 일이 다릅니다"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="70" y="95" font-size="58" fill="#163247" text-anchor="start" font-weight="700">자료마다 맡은 일이 다릅니다</text><rect x="70" y="240" width="330" height="210" rx="20" fill="#eaf3f8" stroke="#b9d3df" stroke-width="3"/><text x="235" y="320" font-size="46" fill="#163247" text-anchor="middle" font-weight="700">학습</text><text x="235" y="400" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">평소 패턴 배우기</text><path d="M410 345 L450 345" fill="none" stroke="#007f86" stroke-width="7" marker-end="url(#arrow)"/><rect x="460" y="240" width="330" height="210" rx="20" fill="#eaf3f8" stroke="#b9d3df" stroke-width="3"/><text x="625" y="320" font-size="46" fill="#163247" text-anchor="middle" font-weight="700">참조 확인</text><text x="625" y="400" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">기준 후보 준비</text><path d="M800 345 L840 345" fill="none" stroke="#007f86" stroke-width="7" marker-end="url(#arrow)"/><rect x="850" y="240" width="330" height="210" rx="20" fill="#eaf3f8" stroke="#b9d3df" stroke-width="3"/><text x="1015" y="320" font-size="46" fill="#163247" text-anchor="middle" font-weight="700">조정</text><text x="1015" y="400" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">A와 B 비교</text><path d="M1190 345 L1230 345" fill="none" stroke="#007f86" stroke-width="7" marker-end="url(#arrow)"/><rect x="1240" y="240" width="330" height="210" rx="20" fill="#eaf3f8" stroke="#b9d3df" stroke-width="3"/><text x="1405" y="320" font-size="46" fill="#163247" text-anchor="middle" font-weight="700">마지막 확인</text><text x="1405" y="400" font-size="40" fill="#163247" text-anchor="middle" font-weight="500">기준 확정 뒤 확인</text><text x="90" y="570" font-size="42" fill="#163247" text-anchor="start" font-weight="500">이상적인 자료 분리: 앞선 시각에서 배우고 뒤의 기록으로 확인</text><rect x="70" y="640" width="1460" height="155" rx="20" fill="#fff7e5" stroke="#e6cf93" stroke-width="3"/><text x="100" y="705" font-size="42" fill="#163247" text-anchor="start" font-weight="500">현재 제공 자료: 시간 혼합과 운전조건 차이가 남아 있음</text><text x="100" y="770" font-size="40" fill="#163247" text-anchor="start" font-weight="500">과거자료 해석으로 사용하고 미래 고장 예측 성능을 주장하지 않음</text></g></svg>